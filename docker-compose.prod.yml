# Production: .env veya .env.production kullanılır.
# cp .env.example .env ile oluşturup production değerleri girin.
services:
  postgres:
    image: postgres:15-alpine
    container_name: tipbox_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tipbox_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tipbox_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-tipbox_prod}
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tipbox_user"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: tipbox_minio_prod
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_prod_data:/data
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tipbox_redis_prod
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - tipbox_network
    command: redis-server --appendonly yes --requirepass tipbox_redis_prod
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: tipbox_backend_prod
    restart: always
    env_file:
