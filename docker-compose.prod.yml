  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   expose:
  #     - "5175"
  #   environment:
  #     - PORT=5175
  #     - NODE_ENV=production
  #     - NODE_OPTIONS=--max-old-space-size=896
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 1200M
  #       reservations:
  #         memory: 384M
  #   networks:
  #     - tipbox_network

volumes:
  postgres_prod_data:
  minio_prod_data:
  redis_prod_data:

networks:
  tipbox_network:
    driver: bridge

