      - tipbox_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    env_file:
      - .env
    container_name: tipbox_admin_panel_prod
    restart: always
    ports:
      - "5174:5174"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - tipbox_network

  nginx:
    image: nginx:alpine
    container_name: tipbox_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - admin-panel
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_prod_data:
  minio_prod_data:
  redis_prod_data:

networks:
  tipbox_network:
    driver: bridge

