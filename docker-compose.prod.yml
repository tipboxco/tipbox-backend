# Production: Proje kökündeki tek .env kullanılır.
# cp .env.example .env ile oluşturup production değerlerini girin.
#
# 4GB RAM sunucu için optimize edilmiş production yapılandırması
name: tipbox-prod
services:
  postgres:
    image: postgres:15-alpine
    container_name: tipbox_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tipbox_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tipbox_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-tipbox_prod}
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - tipbox_network
    command: >
      postgres
        -c shared_buffers=128MB
        -c effective_cache_size=256MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c max_connections=50
        -c checkpoint_completion_target=0.9
        -c wal_buffers=4MB
        -c random_page_cost=1.1
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tipbox_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: tipbox_minio_prod
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_CACHE: "off"
    volumes:
      - minio_prod_data:/data
    networks:
      - tipbox_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tipbox_redis_prod
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - tipbox_network
    command: redis-server --appendonly yes --requirepass tipbox_redis_prod --maxmemory 200mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tipbox_redis_prod", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: tipbox_backend_prod
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=768
      - SKIP_DB_MIGRATIONS=${SKIP_DB_MIGRATIONS:-0}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tipbox_user}:${POSTGRES_PASSWORD:-tipbox_prod_password}@postgres:5432/${POSTGRES_DB:-tipbox_prod}
      - REDIS_URL=${REDIS_URL:-redis://:tipbox_redis_prod@redis:6379}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-tipbox-media}
      - S3_REGION=${S3_REGION:-eu-central-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - ./backend/tipboxbackend-3e2c3d3c0b31.json:/app/tipboxbackend-3e2c3d3c0b31.json:ro
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    env_file:
      - .env
    container_name: tipbox_admin_panel_prod
    restart: always
    ports:
      - "5174:5174"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - tipbox_network

  nginx:
    image: nginx:alpine
    container_name: tipbox_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - admin-panel
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # catalog-service prod'da da gerekli ise aşağıdaki bloğu aktifleştirin:
  # catalog-service:
  #   build:
  #     context: ./catalog-service
  #     dockerfile: Dockerfile.prod
