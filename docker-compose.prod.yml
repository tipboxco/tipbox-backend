    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=4096
      - SKIP_DB_MIGRATIONS=${SKIP_DB_MIGRATIONS:-0}
      # Container içinde çalışırken servis isimlerini kullan
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tipbox_user}:${POSTGRES_PASSWORD:-tipbox_prod_password}@postgres:5432/${POSTGRES_DB:-tipbox_prod}
      - REDIS_URL=${REDIS_URL:-redis://:tipbox_redis_prod@redis:6379}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "3000"
