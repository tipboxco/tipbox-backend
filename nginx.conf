events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:3000;
    }

    upstream catalog {
        server catalog-service:5175;
    }

    upstream admin_panel {
        server admin-panel:5174;
    }

    # Gzip compression (büyük JSON response'lar için optimize edildi)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_disable "msie6";

    # HTTP server
    server {
        listen 80;
        server_name api-test.tipbox.co localhost;

        # Request body size limiti
        client_max_body_size 10M;

        # ACME challenge için (SSL sertifikası alınırken kullanılır)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        # MinIO media proxy
        location /media/ {
            proxy_pass http://minio:9000/tipbox-media/;
            limit_except GET HEAD OPTIONS { deny all; }
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "public, max-age=3600";
            if ($request_method = 'OPTIONS') { return 204; }
        }

        # Admin panel dashboard (strip /dashboard/ prefix, proxy to Vite root)
        location /dashboard/ {
            proxy_pass http://admin_panel/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Vite dev server internal paths (admin panel assets loaded without /dashboard/ prefix)
        location ~ ^/(@vite|@react-refresh|@fs|__vite_hmr|src/|node_modules/) {
            proxy_pass http://admin_panel;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host localhost;
            proxy_cache_bypass $http_upgrade;
        }

        # Catalog service (Medusa)
        location /catalog/ {
            proxy_pass http://catalog/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }

        # API istekleri
        location / {
            # Eğer localhost'tan geliyorsa redirect yapma (local dev)
            if ($host = localhost) {
                proxy_pass http://backend;
                break;
            }
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name api-test.tipbox.co;

        ssl_certificate /etc/letsencrypt/live/api-test.tipbox.co/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api-test.tipbox.co/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 10M;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeout ayarları (büyük response'lar için artırıldı)
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Proxy buffer ayarları (büyük JSON response'lar için)
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 32 16k;
            proxy_busy_buffers_size 64k;
            proxy_temp_file_write_size 64k;
            proxy_max_temp_file_size 512m;
        }

        # Admin panel dashboard (strip /dashboard/ prefix, proxy to Vite root)
        location /dashboard/ {
            proxy_pass http://admin_panel/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Vite dev server internal paths (admin panel assets loaded without /dashboard/ prefix)
        location ~ ^/(@vite|@react-refresh|@fs|__vite_hmr|src/|node_modules/) {
            proxy_pass http://admin_panel;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host localhost;
            proxy_cache_bypass $http_upgrade;
        }

        # Catalog service (Medusa)
        location /catalog/ {
            proxy_pass http://catalog/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }

        location /media/ {
            proxy_pass http://minio:9000/tipbox-media/;
            limit_except GET HEAD OPTIONS { deny all; }
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "public, max-age=3600";
            if ($request_method = 'OPTIONS') { return 204; }
        }
    }
}
