events {
    worker_connections 1024;
}

http {
    # Docker internal DNS resolver
    # Container restart'larında IP değiştiğinde yeniden resolve eder
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression (büyük JSON response'lar için optimize edildi)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_disable "msie6";

    # ─── HTTP server ───
    server {
        listen 80;
        server_name api-test.tipbox.co localhost;

        client_max_body_size 10M;

        # ACME challenge (SSL sertifikası yenileme)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        # MinIO media proxy
        location /media/ {
            set $minio http://minio:9000;
            rewrite ^/media/(.*)$ /tipbox-media/$1 break;
            proxy_pass $minio;
            limit_except GET HEAD OPTIONS { deny all; }
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "public, max-age=3600";
            if ($request_method = 'OPTIONS') { return 204; }
        }

        # Admin panel dashboard
        location /dashboard/ {
            set $admin http://admin-panel:5174;
            rewrite ^/dashboard/(.*)$ /$1 break;
            proxy_pass $admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Vite dev server internal paths
        location ~ ^/(@vite|@react-refresh|@fs|__vite_hmr|src/|node_modules/) {
            set $admin http://admin-panel:5174;
            proxy_pass $admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host localhost;
            proxy_cache_bypass $http_upgrade;
        }

        # Medusa admin dashboard
        location /catalog/app {
            set $catalog http://catalog-service:5175;
            proxy_pass $catalog;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host localhost;
            proxy_cache_bypass $http_upgrade;
        }

        # Catalog admin API (seed, sync vb.)
        location ~ ^/catalog/admin/(seed|sync) {
            set $catalog http://catalog-service:5175;
            proxy_pass $catalog;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Catalog service API
        location /catalog/ {
            set $catalog http://catalog-service:5175;
            rewrite ^/catalog/(.*)$ /$1 break;
            proxy_pass $catalog;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Health check
        location /health {
            set $backend http://backend:3000;
            proxy_pass $backend;
            access_log off;
        }

        # API istekleri — HTTP üzerinden doğrudan proxy
        location / {
            set $backend http://backend:3000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 32 16k;
            proxy_busy_buffers_size 64k;
            proxy_temp_file_write_size 64k;
            proxy_max_temp_file_size 512m;
        }
    }

    # ─── HTTPS server ───
    # SSL sertifikası yoksa bu blok yüklenmez (nginx çökmez)
    include /etc/nginx/conf.d/ssl*.conf;
}
