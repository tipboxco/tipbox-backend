events {
    worker_connections 1024;
}

http {
    # Upstream backend tanımı
    upstream backend {
        server backend:3000;
    }

    # HTTP'den HTTPS'e yönlendirme
    server {
        listen 80;
        server_name api-test.tipbox.co;

        # Let's Encrypt ACME challenge için (ÖNCELİKLİ!)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        # Diğer tüm istekleri HTTPS'e yönlendir
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS yapılandırması
    server {
        listen 443 ssl http2;
        server_name api-test.tipbox.co;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL yapılandırması
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Max upload size (avatar için)
        client_max_body_size 10M;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }

        # MinIO Media Storage - SADECE OKUMA (public)
        location /media/ {
            # MinIO container'ına internal network üzerinden proxy
            proxy_pass http://minio:9000/tipbox-media/;
            
            # Sadece GET ve HEAD isteklerine izin ver (upload/delete engelle)
            limit_except GET HEAD OPTIONS {
                deny all;
            }
            
            # Proxy headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers (frontend için)
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            
            # OPTIONS preflight request
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            
            # Cache headers (1 saat)
            add_header Cache-Control "public, max-age=3600";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer settings
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}