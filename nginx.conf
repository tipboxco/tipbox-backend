events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:3000;
    }

    # HTTP server (SSL olmadan çalışır)
    server {
        listen 80;
        server_name _;

        # ACME challenge için (SSL sertifikası alınırken kullanılır)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        # Backend'e proxy
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }

        location /media/ {
            proxy_pass http://minio:9000/tipbox-media/;
            limit_except GET HEAD OPTIONS { deny all; }
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "public, max-age=3600";
            if ($request_method = 'OPTIONS') { return 204; }
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
        client_max_body_size 10M;
    }

    # HTTPS server (SSL sertifikaları varsa aktif edin)
