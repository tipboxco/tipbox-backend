services:
  postgres:
    image: postgres:15
    container_name: tipbox_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tipbox_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tipbox_network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: tipbox_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tipbox.co
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - tipbox_network

  minio:
    image: minio/minio:latest
    container_name: tipbox_minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - tipbox_network

  redis:
    image: redis:7
    container_name: tipbox_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - tipbox_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tipbox_backend
    restart: always
    ports:
      - "3000:3000"
    # Gizli kalması gerekenler (JWT_SECRET, CLIENT_SECRET, API key'ler vb.) sadece .env'de tanımlanır
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=4096
      - SKIP_DB_MIGRATIONS=${SKIP_DB_MIGRATIONS:-0}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/tipbox_dev
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:9002,https://api-test.tipbox.co
      - CORS_METHODS=GET,POST,PUT,DELETE,OPTIONS,PATCH
      - S3_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
      - S3_BUCKET_NAME=tipbox-media
      - S3_REGION=eu-central-1
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - BASE_URL=http://localhost:3000
      - SEED_MEDIA_BASE_URL=http://localhost:9000
      - SEED_API_TOKEN=deneme
      - GEMINI_MODEL=gemini-2.5-pro
      - GEMINI_MAX_RETRIES=3
      - GEMINI_TIMEOUT=30000
      - EMAIL_FROM_NAME=Tipbox
      - GOOGLE_APPLICATION_CREDENTIALS=./tipboxbackend-3e2c3d3c0b31.json
      - THIRDWEB_WALLET_ID=tipbox-embedded-wallet
      - THIRDWEB_DEFAULT_CHAIN_ID=11155111
      - THIRDWEB_SPONSOR_GAS=true
      - THIRDWEB_WEBHOOK_EXPIRATION_SECONDS=300
      - THIRDWEB_WEBHOOK_SKIP_SIGNATURE_IN_DEV=true
      - THIRDWEB_WATCHED_CONTRACTS=${THIRDWEB_WATCHED_CONTRACTS:-0xa6352D525BeBFd87F3De30DB7D42D08f6Ca015C6}
      - TIPS_TOKEN_DECIMALS=18
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./backend:/app
      - backend_node_modules_v2:/app/node_modules
      - ./backend/tipboxbackend-3e2c3d3c0b31.json:/app/tipboxbackend-3e2c3d3c0b31.json:ro
      # Docker daemon'a erişim için host docker.sock'u container'a bağla
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: npm run dev
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: tipbox_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prisma-studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tipbox_prisma_studio
    restart: always
    ports:
      - "5555:5555"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/tipbox_dev
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - backend_prisma_node_modules:/app/node_modules
    working_dir: /app
    command: npx prisma studio --port 5555 --browser none
    networks:
      - tipbox_network

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: tipbox_catalog_service
    restart: always
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "9002:9000"  # Medusa backend API (host:container - minio ile çakışmaması için 9002)
      - "5173:5173"  # Medusa admin dashboard
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=4096
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/medusa-store?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - TIPBOX_BACKEND_API_KEY=deneme
      - TIPBOX_BACKEND_URL=http://backend:3000
      # CORS ayarları (Medusa için gerekli)
      - STORE_CORS=http://localhost:8000,http://localhost:3000
      - ADMIN_CORS=http://localhost:5173,http://localhost:9002
      - AUTH_CORS=http://localhost:5173,http://localhost:9002,http://localhost:8000
      # MinIO yapılandırması - Docker Compose ile çalışan MinIO için
      # Region parametresi gerekli değil (MinIO local storage için region kullanmaz)
      - S3_ENDPOINT=http://minio:9000
      - S3_ENDPOINT_EXTERNAL=http://localhost:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
      - S3_BUCKET_NAME=tipbox-media
      - S3_REGION=eu-central-1
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
    volumes:
      - ./catalog-service:/server
      - catalog_service_node_modules:/server/node_modules
    working_dir: /server
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: tipbox_admin_panel
    restart: always
    ports:
      - "5174:5174"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./admin-panel:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev
    networks:
      - tipbox_network

volumes:
  pgdata:
  pgadmin_data:
  minio_data:
  redis_data:
  backend_node_modules_v2:
  backend_prisma_node_modules:
  catalog_service_node_modules:

networks:
  tipbox_network:
    driver: bridge