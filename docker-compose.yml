# Tüm servisler proje kökündeki .env dosyasını kullanır.
# cp .env.example .env ile oluşturun.
services:
  postgres:
    image: postgres:15-alpine
    container_name: tipbox_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tipbox_dev}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: tipbox_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tipbox.co
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - tipbox_network

  minio:
    image: minio/minio:latest
    container_name: tipbox_minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tipbox_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tipbox_backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=4096
      - SKIP_DB_MIGRATIONS=${SKIP_DB_MIGRATIONS:-0}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tipbox_dev}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5174,http://localhost:5175,https://api-test.tipbox.co}
      - CORS_METHODS=GET,POST,PUT,DELETE,OPTIONS,PATCH
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-tipbox-media}
      - S3_REGION=${S3_REGION:-eu-central-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - SEED_MEDIA_BASE_URL=http://localhost:9000
      - SEED_API_TOKEN=deneme
      - GEMINI_MODEL=gemini-2.5-pro
      - GEMINI_MAX_RETRIES=3
      - GEMINI_TIMEOUT=30000
      - EMAIL_FROM_NAME=Tipbox
      - GOOGLE_APPLICATION_CREDENTIALS=./tipboxbackend-3e2c3d3c0b31.json
      - THIRDWEB_WALLET_ID=tipbox-embedded-wallet
      - THIRDWEB_DEFAULT_CHAIN_ID=11155111
      - THIRDWEB_SPONSOR_GAS=true
      - THIRDWEB_WEBHOOK_EXPIRATION_SECONDS=300
      - THIRDWEB_WEBHOOK_SKIP_SIGNATURE_IN_DEV=true
      - THIRDWEB_WATCHED_CONTRACTS=${THIRDWEB_WATCHED_CONTRACTS:-0xa6352D525BeBFd87F3De30DB7D42D08f6Ca015C6}
      - TIPS_TOKEN_DECIMALS=18
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules_v2:/app/node_modules
      - ./backend/tipboxbackend-3e2c3d3c0b31.json:/app/tipboxbackend-3e2c3d3c0b31.json:ro
    working_dir: /app
    command: pnpm run dev
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: tipbox_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prisma-studio:
    image: node:23-alpine
    container_name: tipbox_prisma_studio
    restart: always
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tipbox_dev}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/prisma:/app/prisma:ro
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm add prisma@6.19.2 @prisma/client@6.19.2 && npx prisma studio --port 5555 --browser none"
    networks:
      - tipbox_network

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: tipbox_catalog_service
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5175:5175"  # Medusa server (API + admin dashboard)
    environment:
      - PORT=5175
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=4096
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/medusa-store?sslmode=disable
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - TIPBOX_BACKEND_API_KEY=${TIPBOX_BACKEND_API_KEY:-deneme}
      - TIPBOX_BACKEND_URL=${TIPBOX_BACKEND_URL:-http://backend:3000}
      - STORE_CORS=${STORE_CORS:-http://localhost:8000,http://localhost:3000}
      - ADMIN_CORS=${ADMIN_CORS:-http://localhost:5175}
      - AUTH_CORS=${AUTH_CORS:-http://localhost:5175,http://localhost:8000}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ENDPOINT_EXTERNAL=http://localhost:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-tipbox-media}
      - S3_REGION=${S3_REGION:-eu-central-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - ./catalog-service:/server
      - catalog_service_node_modules:/server/node_modules
    working_dir: /server
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5175/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: tipbox_admin_panel
    restart: always
    ports:
      - "5174:5174"
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3000}
    depends_on:
      - backend
    volumes:
      - ./admin-panel:/app
      - admin_panel_node_modules:/app/node_modules
    working_dir: /app
    command: pnpm run dev
    networks:
      - tipbox_network

volumes:
  pgdata:
  pgadmin_data:
  minio_data:
  redis_data:
  backend_node_modules_v2:
  catalog_service_node_modules:
  admin_panel_node_modules:

networks:
  tipbox_network:
    driver: bridge