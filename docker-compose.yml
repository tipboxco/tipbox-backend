# Development: Proje kökündeki .env kullanılır.
# cp .env.example .env ile oluşturup değerlerinizi girin.
#
# 4GB RAM sunucu için optimize edilmiş yapılandırma (swap önerilir)
name: tipbox-dev
# Toplam bellek dağılımı:
#   Backend sınırsız | Catalog sınırsız | PostgreSQL 384MB | Redis 256MB
#   Admin 512MB | prisma-studio sınırsız | pgadmin 512MB | PostgreSQL sınırsız | MinIO 192MB | Nginx 64MB
services:
  postgres:
    image: postgres:15-alpine
    container_name: tipbox_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tipbox_dev}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tipbox_network
    # PostgreSQL tuning
    command: >
      postgres
        -c shared_buffers=128MB
        -c effective_cache_size=256MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c max_connections=50
        -c checkpoint_completion_target=0.9
        -c wal_buffers=4MB
        -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tipbox_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: tipbox_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tipbox.co
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - tipbox_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M

  minio:
    image: minio/minio:latest
    container_name: tipbox_minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_CACHE: "off"
    volumes:
      - minio_data:/data
    networks:
      - tipbox_network
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tipbox_redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - tipbox_network
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - allkeys-lru
      - --stop-writes-on-bgsave-error
      - "no"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tipbox_backend
    restart: always
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=2048
      - SKIP_DB_MIGRATIONS=${SKIP_DB_MIGRATIONS:-0}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tipbox_dev}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5174,http://localhost:5175}
      - CORS_METHODS=${CORS_METHODS:-GET,POST,PUT,DELETE,OPTIONS,PATCH}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-tipbox-media}
      - S3_REGION=${S3_REGION:-eu-central-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - SEED_MEDIA_BASE_URL=${SEED_MEDIA_BASE_URL:-http://localhost:9000}
      - SEED_API_TOKEN=${SEED_API_TOKEN:-deneme}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-pro}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-3}
      - GEMINI_TIMEOUT=${GEMINI_TIMEOUT:-30000}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Tipbox}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-./tipboxbackend-3e2c3d3c0b31.json}
      - THIRDWEB_WALLET_ID=${THIRDWEB_WALLET_ID:-tipbox-embedded-wallet}
      - THIRDWEB_DEFAULT_CHAIN_ID=${THIRDWEB_DEFAULT_CHAIN_ID:-11155111}
      - THIRDWEB_SPONSOR_GAS=${THIRDWEB_SPONSOR_GAS:-true}
      - THIRDWEB_WEBHOOK_EXPIRATION_SECONDS=${THIRDWEB_WEBHOOK_EXPIRATION_SECONDS:-300}
      - THIRDWEB_WEBHOOK_SKIP_SIGNATURE_IN_DEV=${THIRDWEB_WEBHOOK_SKIP_SIGNATURE_IN_DEV:-true}
      - THIRDWEB_WATCHED_CONTRACTS=${THIRDWEB_WATCHED_CONTRACTS:-0xa6352D525BeBFd87F3De30DB7D42D08f6Ca015C6}
      - TIPS_TOKEN_DECIMALS=${TIPS_TOKEN_DECIMALS:-18}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/tipboxbackend-3e2c3d3c0b31.json:/app/tipboxbackend-3e2c3d3c0b31.json:ro
      - ./logs:/app/logs
    working_dir: /app
    command: pnpm run dev
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 300s

  nginx:
    image: nginx:alpine
    container_name: tipbox_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-ssl-init.sh:/docker-entrypoint.d/40-ssl-init.sh
      - ./logs/nginx:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        chmod +x /docker-entrypoint.d/40-ssl-init.sh 2>/dev/null
        /docker-entrypoint.sh nginx -g "daemon off;"
    depends_on:
      backend:
        condition: service_started
    networks:
      - tipbox_network
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  prisma-studio:
    image: node:23-alpine
    container_name: tipbox_prisma_studio
    restart: always
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tipbox_dev}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/prisma:/app/prisma:ro
      - prisma_studio_node_modules:/app/node_modules
    working_dir: /app
    command: >
      sh -c "
        if [ ! -d node_modules/prisma ]; then
          npm install prisma@6 @prisma/client@6 --no-fund --no-audit;
        fi &&
        BROWSER=none npx prisma studio --port 5555 --hostname 0.0.0.0
      "
    networks:
      - tipbox_network

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: tipbox_admin_panel
    restart: always
    ports:
      - "5174:5174"
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3000/api}
      - VITE_BASE_PATH=/dashboard
      - NODE_OPTIONS=--max-old-space-size=384
    depends_on:
      - backend
    volumes:
      - ./admin-panel:/app
      - admin_panel_node_modules:/app/node_modules
    working_dir: /app
    command: pnpm run dev
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - tipbox_network

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: tipbox_catalog_service
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5175:5175"  # Medusa server (API + admin dashboard)
    environment:
      - PORT=5175
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=1600
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/medusa-store?sslmode=disable
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - TIPBOX_BACKEND_API_KEY=${TIPBOX_BACKEND_API_KEY:-deneme}
      - TIPBOX_BACKEND_URL=${TIPBOX_BACKEND_URL:-http://backend:3000}
      - MEDUSA_BACKEND_URL=${MEDUSA_BACKEND_URL:-http://localhost/catalog}
      - STORE_CORS=${STORE_CORS:-http://localhost:8000,http://localhost:3000}
      - ADMIN_CORS=${ADMIN_CORS:-http://localhost:5175}
      - AUTH_CORS=${AUTH_CORS:-http://localhost:5175,http://localhost:8000}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ENDPOINT_EXTERNAL=${S3_ENDPOINT_EXTERNAL:-http://localhost:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-tipbox-media}
      - S3_REGION=${S3_REGION:-eu-central-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
      - MEDUSA_ADMIN_PATH=${MEDUSA_ADMIN_PATH:-/catalog/app}
      - MEDUSA_ADMIN_BACKEND_URL=${MEDUSA_ADMIN_BACKEND_URL:-http://localhost/catalog}
    volumes:
      - ./catalog-service:/server
      - catalog_service_node_modules:/server/node_modules
    working_dir: /server
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5175/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:
  redis_data:
  backend_node_modules:
  admin_panel_node_modules:
  catalog_service_node_modules:
  prisma_studio_node_modules:

networks:
  tipbox_network:
    driver: bridge
