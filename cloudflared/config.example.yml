# ============================================
# Cloudflared Tunnel - Örnek Konfigürasyon (Tipbox)
# ============================================
# Bu dosyayı config.yml olarak kopyalayın ve değerleri güncelleyin:
#   cp config.example.yml config.yml
#
# Tunnel oluşturma:
#   cloudflared tunnel create tipbox-tunnel
# Bu komut credentials dosyasını ~/.cloudflared/ oluşturur.
#
# api-tipbox.tipbox.co -> backend:3000 (tek servis)

tunnel: <TUNNEL_UUID>
credentials-file: .cloudflared/<TUNNEL_UUID>.json

ingress:
  # api-tipbox.tipbox.co - Backend API
  - hostname: api-tipbox.tipbox.co
    service: http://localhost:3000
    originRequest:
      connectTimeout: 30s
      # Auth0 callback için: Backend'e Host header olarak orijinal hostname iletilir
      httpHostHeader: api-tipbox.tipbox.co

  # minio-tipbox.tipbox.co - MinIO S3 API (port 9000)
  - hostname: minio-tipbox.tipbox.co
    service: http://localhost:9000
    originRequest:
      connectTimeout: 30s
      httpHostHeader: minio-tipbox.tipbox.co

  - service: http_status:404
