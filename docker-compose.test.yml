services:
  postgres:
    image: postgres:15-alpine
    container_name: tipbox_postgres_test
    restart: always
    environment:
      POSTGRES_USER: tipbox_user
      POSTGRES_PASSWORD: tipbox_test_password
      POSTGRES_DB: tipbox_test
    expose:
      - "5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tipbox_user"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: tipbox_pgadmin_test
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tipbox.co
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_test_data:/var/lib/pgadmin
    networks:
      - tipbox_network

  minio:
    image: minio/minio:latest
    container_name: tipbox_minio_test
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_test_data:/data
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tipbox_redis_test
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_test_data:/data
    networks:
      - tipbox_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build: .
    container_name: tipbox_backend_test
    restart: always
    command: npm run dev
    env_file:
      - .env.test
    environment:
      - NODE_ENV=test
      - NODE_OPTIONS=--max-old-space-size=4096
      - SKIP_DB_MIGRATIONS=${SKIP_DB_MIGRATIONS:-0}
      # Container içinde çalışırken servis isimlerini kullan
      - DATABASE_URL=postgresql://tipbox_user:tipbox_test_password@postgres:5432/tipbox_test
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./tipboxbackend-3e2c3d3c0b31.json:/app/tipboxbackend-3e2c3d3c0b31.json:ro
      - ./logs:/app/logs
      # Docker daemon'a erişim için host docker.sock'u container'a bağla
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: tipbox_nginx_test
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prisma-studio:
    build: .
    container_name: tipbox_prisma_studio_test
    restart: always
    ports:
      - "5555:5555"
    env_file:
      - .env.test
    environment:
      - DATABASE_URL=postgresql://tipbox_user:tipbox_test_password@postgres:5432/tipbox_test
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: npx prisma studio --port 5555 --browser none
    networks:
      - tipbox_network

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: tipbox_admin_panel_test
    restart: always
    ports:
      - "5174:5174"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./admin-panel:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev
    networks:
      - tipbox_network

volumes:
  postgres_test_data:
  pgadmin_test_data:
  minio_test_data:
  redis_test_data:

networks:
  tipbox_network:
    driver: bridge

