# Test: Proje kökündeki .env.test kullanılır.
# cp .env.example .env.test ile oluşturup test değerlerini (isteğe bağlı) girin.
services:
  postgres:
    image: postgres:15-alpine
    container_name: tipbox_postgres_test
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tipbox_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tipbox_test_password}
      POSTGRES_DB: ${POSTGRES_DB:-tipbox_test}
    expose:
      - "5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tipbox_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: tipbox_pgadmin_test
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tipbox.co
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_test_data:/var/lib/pgadmin
    networks:
      - tipbox_network

  minio:
    image: minio/minio:latest
    container_name: tipbox_minio_test
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_test_data:/data
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tipbox_redis_test
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_test_data:/data
    networks:
      - tipbox_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tipbox_backend_test
    restart: always
    env_file:
      - .env.test
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=test
      - NODE_OPTIONS=--max-old-space-size=4096
      - SKIP_DB_MIGRATIONS=${SKIP_DB_MIGRATIONS:-0}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tipbox_user}:${POSTGRES_PASSWORD:-tipbox_test_password}@postgres:5432/${POSTGRES_DB:-tipbox_test}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://api-test.tipbox.co,http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:9002}
      - CORS_METHODS=${CORS_METHODS:-GET,POST,PUT,DELETE,OPTIONS,PATCH}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-tipbox-media}
      - S3_REGION=${S3_REGION:-eu-central-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
      - BASE_URL=${BASE_URL:-https://api-test.tipbox.co}
      - SEED_MEDIA_BASE_URL=${SEED_MEDIA_BASE_URL:-https://api-test.tipbox.co/media}
      - SEED_API_TOKEN=${SEED_API_TOKEN:-deneme}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-pro}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-3}
      - GEMINI_TIMEOUT=${GEMINI_TIMEOUT:-30000}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Tipbox}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-./tipboxbackend-3e2c3d3c0b31.json}
      - THIRDWEB_WALLET_ID=${THIRDWEB_WALLET_ID:-tipbox-embedded-wallet}
      - THIRDWEB_DEFAULT_CHAIN_ID=${THIRDWEB_DEFAULT_CHAIN_ID:-11155111}
      - THIRDWEB_SPONSOR_GAS=${THIRDWEB_SPONSOR_GAS:-true}
      - THIRDWEB_WEBHOOK_EXPIRATION_SECONDS=${THIRDWEB_WEBHOOK_EXPIRATION_SECONDS:-300}
      - THIRDWEB_WEBHOOK_SKIP_SIGNATURE_IN_DEV=${THIRDWEB_WEBHOOK_SKIP_SIGNATURE_IN_DEV:-true}
      - THIRDWEB_WATCHED_CONTRACTS=${THIRDWEB_WATCHED_CONTRACTS:-0xa6352D525BeBFd87F3De30DB7D42D08f6Ca015C6}
      - TIPS_TOKEN_DECIMALS=${TIPS_TOKEN_DECIMALS:-18}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_test_node_modules:/app/node_modules
      - ./backend/tipboxbackend-3e2c3d3c0b31.json:/app/tipboxbackend-3e2c3d3c0b31.json:ro
      - ./logs:/app/logs
      # Docker daemon'a erişim için host docker.sock'u container'a bağla
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: pnpm run dev
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: tipbox_nginx_test
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prisma-studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tipbox_prisma_studio_test
    restart: always
    ports:
      - "5555:5555"
    env_file:
      - .env.test
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tipbox_user}:${POSTGRES_PASSWORD:-tipbox_test_password}@postgres:5432/${POSTGRES_DB:-tipbox_test}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_test_prisma_node_modules:/app/node_modules
    working_dir: /app
    command: npx prisma studio --port 5555 --browser none
    networks:
      - tipbox_network

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: tipbox_admin_panel_test
    restart: always
    ports:
      - "5174:5174"
    env_file:
      - .env.test
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://api-test.tipbox.co}
    depends_on:
      - backend
    volumes:
      - ./admin-panel:/app
      - /app/node_modules
    working_dir: /app
    command: pnpm run dev
    networks:
      - tipbox_network

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: tipbox_catalog_service_test
    restart: always
    env_file:
      - .env.test
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "9002:9000"  # Medusa backend API (host:container - minio ile çakışmaması için 9002)
      - "5173:5173"  # Medusa admin dashboard
    environment:
      - NODE_ENV=test
      - NODE_OPTIONS=--max-old-space-size=4096
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tipbox_user}:${POSTGRES_PASSWORD:-tipbox_test_password}@postgres:5432/medusa-store?sslmode=disable
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - TIPBOX_BACKEND_API_KEY=${TIPBOX_BACKEND_API_KEY:-deneme}
      - TIPBOX_BACKEND_URL=${TIPBOX_BACKEND_URL:-http://backend:3000}
      - STORE_CORS=${STORE_CORS:-https://api-test.tipbox.co,http://localhost:8000,http://localhost:3000}
      - ADMIN_CORS=${ADMIN_CORS:-https://api-test.tipbox.co,http://localhost:5173,http://localhost:9002}
      - AUTH_CORS=${AUTH_CORS:-https://api-test.tipbox.co,http://localhost:5173,http://localhost:9002,http://localhost:8000}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ENDPOINT_EXTERNAL=https://api-test.tipbox.co/media
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-tipbox-media}
      - S3_REGION=${S3_REGION:-eu-central-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - ./catalog-service:/server
      - catalog_service_test_node_modules:/server/node_modules
    working_dir: /server
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - tipbox_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_test_data:
  pgadmin_test_data:
  minio_test_data:
  redis_test_data:
  backend_test_node_modules:
  backend_test_prisma_node_modules:
  catalog_service_test_node_modules:

networks:
  tipbox_network:
    driver: bridge

