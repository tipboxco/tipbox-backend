name: Deploy to Hetzner Test Server

on:
  push:
    branches:
      - test
      - staging
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging

env:
  NODE_VERSION: '23.6.0'
  DOCKER_COMPOSE_VERSION: '2.24.0'

jobs:
  deploy:
    name: Deploy to Hetzner Test Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'test' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint
        continue-on-error: true
        env:
          ESLINT_NO_DEV_ERRORS: true

      - name: Build TypeScript
        run: npm run build
        continue-on-error: true

      - name: Check SSH secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.HETZNER_SSH_KEY }}" ]; then
            echo "⚠️  HETZNER_SSH_KEY secret not configured. Skipping deployment."
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        if: steps.check-secrets.outputs.available == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known hosts
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Configure SSH
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          cat >> ~/.ssh/config <<EOC
          Host hetzner-deploy
            HostName ${{ secrets.HETZNER_HOST }}
            User ${{ secrets.HETZNER_USER }}
            Port ${{ secrets.HETZNER_SSH_PORT || '22' }}
            IdentityAgent $SSH_AUTH_SOCK
            StrictHostKeyChecking accept-new
          EOC
          chmod 600 ~/.ssh/config

      - name: Test SSH Connection
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          echo "Testing SSH connection..."
          ssh -v hetzner-deploy "echo '✅ SSH connection successful!'"

      - name: Deploy to server
        if: steps.check-secrets.outputs.available == 'true'
        env:
          DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
        run: |
          ssh hetzner-deploy "export DEPLOY_BRANCH='$DEPLOY_BRANCH' && bash -s" << 'EOF'
            set -e
            
            echo "🚀 Starting test environment deployment..."
            
            # Branch değişkenini al
            echo "📌 Deploying branch: $DEPLOY_BRANCH"
            PROJECT_DIR="/opt/tipbox-backend"
            COMPOSE_FILE="docker-compose.yml"
            
            # Proje dizinine git
            cd "$PROJECT_DIR" || {
              echo "❌ Project directory not found: $PROJECT_DIR"
              exit 1
            }
            
            # Git pull
            echo "📥 Pulling latest changes from branch: $DEPLOY_BRANCH"
            git fetch origin
            git checkout "$DEPLOY_BRANCH"
            git pull origin "$DEPLOY_BRANCH"
            
            # Environment dosyasının varlığını kontrol et
            if [ ! -f .env ]; then
              echo "❌ .env file not found! Please create it first."
              exit 1
            fi
            
            # Database backup (opsiyonel ama önerilir)
            echo "💾 Creating database backup..."
            BACKUP_DIR="${PROJECT_DIR}/backups"
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="${BACKUP_DIR}/backup-$(date +%Y%m%d-%H%M%S).sql"
            docker compose -f "$COMPOSE_FILE" exec -T postgres pg_dump -U postgres tipbox_dev > "$BACKUP_FILE" 2>/dev/null || {
              echo "⚠️  Backup failed or database not accessible, continuing..."
            }
            
            # Tüm servisleri durdur ve sil (migration ve seed için)
            echo "🛑 Stopping and removing all containers..."
            docker compose -f "$COMPOSE_FILE" down || {
              echo "⚠️  Some containers were not running, continuing..."
            }
            
            # Docker Compose ile build
            echo "🔨 Building Docker images..."
            docker compose -f "$COMPOSE_FILE" build --no-cache backend
            
            # Prisma Client generate (host'ta - volume mount için)
            echo "🔧 Generating Prisma Client on host..."
            npx prisma generate || {
              echo "⚠️  Prisma generate on host failed, trying in container..."
              docker compose -f "$COMPOSE_FILE" run --rm backend npx prisma generate || {
                echo "❌ Prisma generate failed! Check the logs above."
                exit 1
              }
            }
            
            # Tüm servisleri başlat (database, redis, minio)
            echo "🚀 Starting infrastructure services..."
            docker compose -f "$COMPOSE_FILE" up -d postgres redis minio
            
            # Database'in hazır olmasını bekle
            echo "⏳ Waiting for database to be ready..."
            sleep 5
            for i in {1..20}; do
              if docker compose -f "$COMPOSE_FILE" exec -T postgres pg_isready -U postgres > /dev/null 2>&1; then
                echo "✅ Database is ready!"
                break
              fi
              if [ $i -eq 20 ]; then
                echo "❌ Database not ready after 20 attempts"
                docker compose -f "$COMPOSE_FILE" logs postgres
                exit 1
              fi
              echo "⏳ Waiting for database... ($i/20)"
              sleep 2
            done
            
            # Migration'ları çalıştır (backend container başlatılmadan önce)
            echo "📊 Running database migrations..."
            docker compose -f "$COMPOSE_FILE" run --rm backend npx prisma migrate deploy || {
              echo "❌ Migration failed! Check the logs above."
              echo "📋 Migration logs:"
              docker compose -f "$COMPOSE_FILE" logs backend | tail -50
              exit 1
            }
            
            # Seed data'ları ekle (eğer yoksa)
            echo "🌱 Running database seeds..."
            docker compose -f "$COMPOSE_FILE" run --rm backend npm run seed:all || {
              echo "⚠️  Seed failed or data already exists, continuing..."
            }
            
            # Tüm servisleri başlat (backend, nginx, prisma-studio)
            echo "🚀 Starting all services..."
            docker compose -f "$COMPOSE_FILE" up -d
            
            # Health check
            echo "🏥 Checking backend health..."
            sleep 10
            MAX_RETRIES=30
            RETRY_COUNT=0
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if docker compose -f "$COMPOSE_FILE" exec -T backend node -e "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" 2>/dev/null; then
                echo "✅ Backend is healthy!"
                break
              fi
              
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                echo "❌ Health check failed after $MAX_RETRIES attempts"
                echo "📋 Backend logs:"
                docker compose -f "$COMPOSE_FILE" logs --tail=50 backend
                exit 1
              fi
              
              echo "⏳ Waiting for backend to be ready... ($RETRY_COUNT/$MAX_RETRIES)"
              sleep 2
            done
            
            # Eski image'ları temizle
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f
            
            # Container durumunu göster
            echo "📊 Container status:"
            docker compose -f "$COMPOSE_FILE" ps
            
            echo "✅ Test environment deployment completed successfully!"
          EOF

      - name: Deployment Summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Server**: ${{ secrets.HETZNER_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

