name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
        type: string

env:
  NODE_VERSION: '23'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tipbox.co
    
    steps:
      - name: Confirm deployment
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "❌ Deployment cancelled. You must type 'DEPLOY' to confirm."
            exit 1
          fi
          echo "✅ Production deployment confirmed"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Run linter
        run: pnpm --filter tipbox-backend run lint
        continue-on-error: true
        env:
          ESLINT_NO_DEV_ERRORS: true

      - name: Run tests
        run: pnpm --filter tipbox-backend test
        continue-on-error: true

      - name: Build TypeScript
        run: pnpm --filter tipbox-backend run build

      - name: Check SSH secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.HETZNER_PRODUCTION_SSH_KEY }}" ]; then
            echo "⚠️  HETZNER_PRODUCTION_SSH_KEY secret not configured. Skipping deployment."
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        if: steps.check-secrets.outputs.available == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_PRODUCTION_SSH_KEY }}

      - name: Add server to known hosts
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          ssh-keyscan -H ${{ secrets.HETZNER_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production server
        if: steps.check-secrets.outputs.available == 'true'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_PRODUCTION_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_PRODUCTION_USER }}
          HETZNER_SSH_PORT: ${{ secrets.HETZNER_PRODUCTION_SSH_PORT || '22' }}
        run: |
          ssh -p ${{ env.HETZNER_SSH_PORT }} ${{ env.HETZNER_USER }}@${{ env.HETZNER_HOST }} << 'EOF'
            set -e
            
            echo "🚀 Starting PRODUCTION deployment..."
            
            # Proje dizinine git
            cd /opt/tipbox-backend
            
            # Git pull
            echo "📥 Pulling latest changes from main branch..."
            git fetch origin
            git checkout main
            git pull origin main
            
            # Environment dosyasının varlığını kontrol et
            if [ ! -f backend/.env.production ]; then
              echo "❌ backend/.env.production file not found! Please create it first."
              exit 1
            fi
            
            # Database backup (production için zorunlu)
            echo "💾 Creating database backup..."
            BACKUP_DIR="/opt/tipbox-backend/backups"
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/backup-$(date +%Y%m%d-%H%M%S).sql"
            docker compose -f docker-compose.prod.yml exec -T postgres pg_dump -U tipbox_user tipbox_prod > "$BACKUP_FILE" || {
              echo "⚠️  Backup failed, but continuing..."
            }
            
            # Docker Compose ile build ve deploy
            echo "🔨 Building Docker images..."
            docker compose -f docker-compose.prod.yml build --no-cache backend
            
            echo "🚀 Starting containers..."
            docker compose -f docker-compose.prod.yml up -d
            
            # Migration'ları çalıştır
            echo "📊 Running database migrations..."
            docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy || {
              echo "❌ Migration failed! Consider rolling back."
              exit 1
            }
            
            # Health check
            echo "🏥 Checking backend health..."
            sleep 15
            for i in {1..30}; do
              if docker compose -f docker-compose.prod.yml exec -T backend node -e "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" 2>/dev/null; then
                echo "✅ Backend is healthy!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "❌ Health check failed after 30 attempts"
                docker compose -f docker-compose.prod.yml logs backend
                echo "⚠️  Consider rolling back to previous version!"
                exit 1
              fi
              echo "⏳ Waiting for backend to be ready... ($i/30)"
              sleep 2
            done
            
            # Eski image'ları temizle (production'da daha dikkatli)
            echo "🧹 Cleaning up old Docker images (keeping last 24h)..."
            docker image prune -f --filter "until=24h"
            
            echo "✅ Production deployment completed successfully!"
            echo "📝 Backup location: $BACKUP_FILE"
            
            # Container durumunu göster
            echo "📊 Container status:"
            docker compose -f docker-compose.prod.yml ps
          EOF

      - name: Deployment Summary
        if: success()
        run: |
          echo "## ✅ Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: main" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Server**: ${{ secrets.HETZNER_PRODUCTION_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **IMPORTANT**: Database backup was created before deployment." >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed
        if: failure()
        run: |
          echo "## ❌ Production Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **CRITICAL**: Please check the logs and consider rolling back!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: main" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

