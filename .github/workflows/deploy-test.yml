name: Deploy to Test Server

# Otomatik Deployment: test/staging branch'ine push yapıldığında
#   - Seed: Çalışmaz (mevcut data korunur)
#   - Build: Sadece değişen servisler build edilir
#   - Backup: Alınır (güvenli)
#   - Restart: Sadece değişen servisler restart edilir (diğerleri çalışmaya devam eder)
#
# Manuel Deployment: "Run workflow" butonu ile
#   - Tüm seçenekler sizin kontrolünüzde
#   - Detaylı kılavuz: .github/DEPLOYMENT_GUIDE.md

on:
  push:
    branches:
      - test
      - staging
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging
      run_seed:
        description: 'Run seed data? (Varsayılan: Hayır)'
        required: false
        default: false
        type: boolean
      force_rebuild:
        description: 'Force rebuild without cache? (Varsayılan: Hayır)'
        required: false
        default: false
        type: boolean
      skip_backup:
        description: 'Skip database backup? (Varsayılan: Hayır)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      admin: ${{ steps.changes.outputs.admin }}
      catalog: ${{ steps.changes.outputs.catalog }}
      changed_services: ${{ steps.changes.outputs.changed_services }}
      infra_changed: ${{ steps.changes.outputs.infra_changed }}
      needs_deploy: ${{ steps.changes.outputs.needs_deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          OUTPUT_FILE: ${{ github.output }}
        run: |
          EVENT_NAME="${{ github.event_name }}" \
          OUTPUT_FILE="$GITHUB_OUTPUT" \
          bash .github/scripts/initialize/detect-changes.sh

  deploy:
    name: Deploy to Test Server
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.needs_deploy == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment info
        run: |
          echo "## 📋 Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend changed | \`${{ needs.detect-changes.outputs.backend }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin changed | \`${{ needs.detect-changes.outputs.admin }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Catalog changed | \`${{ needs.detect-changes.outputs.catalog }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Infra changed | \`${{ needs.detect-changes.outputs.infra_changed }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Services to build | \`${{ needs.detect-changes.outputs.changed_services || 'all' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check SSH secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.HETZNER_SSH_KEY }}" ]; then
            echo "⚠️  HETZNER_SSH_KEY secret not configured. Skipping deployment."
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        if: steps.check-secrets.outputs.available == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Configure SSH
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          mkdir -p ~/.ssh ~/.ssh/controlmasters
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOC
          Host hetzner-deploy
            HostName ${{ secrets.HETZNER_HOST }}
            User ${{ secrets.HETZNER_USER }}
            Port ${{ secrets.HETZNER_SSH_PORT || '22' }}
            IdentityAgent $SSH_AUTH_SOCK
            StrictHostKeyChecking accept-new
            ServerAliveInterval 60
            ServerAliveCountMax 10
            TCPKeepAlive yes
            ConnectTimeout 30
            ControlMaster auto
            ControlPath ~/.ssh/controlmasters/%r@%h:%p
            ControlPersist 10m
          EOC
          chmod 600 ~/.ssh/config

      # ── 1. Prepare: git pull ──
      - name: Prepare deployment
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: prepare
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          deploy_branch: ${{ github.event.inputs.branch || github.ref_name }}
          env_file: .env.test

      # ── 2. Backup (skip_backup=true ise atlanır) — stop öncesi, postgres hâlâ ayakta ──
      - name: Backup database
        if: steps.check-secrets.outputs.available == 'true' && github.event.inputs.skip_backup != 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: backup
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          db_user: tipbox_user
          db_name: tipbox_test

      # ── 3. Build (sadece değişen servisler) ──
      - name: Build images
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: build
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          force_rebuild: ${{ github.event.inputs.force_rebuild == 'true' && 'true' || 'false' }}
          changed_services: ${{ needs.detect-changes.outputs.changed_services }}

      # ── 4. Stop (infra değiştiyse full stop, değilse sadece değişen servisler) ──
      - name: Stop services
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: stop
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          changed_services: ${{ needs.detect-changes.outputs.changed_services }}
          infra_changed: ${{ needs.detect-changes.outputs.infra_changed }}

      # ── 5. Start (infra değiştiyse full start, değilse sadece değişen servisler) ──
      - name: Start services
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: start
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          changed_services: ${{ needs.detect-changes.outputs.changed_services }}
          infra_changed: ${{ needs.detect-changes.outputs.infra_changed }}

      # ── 6. Health check ──
      - name: Health check
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: health
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      # ── 7. SSL certificate renewal ──
      - name: SSL certificate check & renewal
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: ssl-renew
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      # ── 8. Seed (sadece manuel + istenirse) ──
      - name: Run seeds
        if: steps.check-secrets.outputs.available == 'true' && github.event.inputs.run_seed == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: seed
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          db_user: tipbox_user
          db_name: tipbox_test

      # ── 9. Cleanup ──
      - name: Cleanup deployment
        if: always() && steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: cleanup
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      - name: Deployment Summary
        if: success()
        run: |
          SERVICES="${{ needs.detect-changes.outputs.changed_services }}"
          INFRA="${{ needs.detect-changes.outputs.infra_changed }}"
          if [ "$INFRA" = "true" ] || [ -z "$SERVICES" ]; then
            MODE="Full restart (all services)"
          else
            MODE="Selective restart ($SERVICES)"
          fi
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.event.inputs.branch || github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Type | ${{ github.event_name == 'workflow_dispatch' && 'Manuel' || 'Otomatik' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | $MODE |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Yukarıdaki step loglarını kontrol edin." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.event.inputs.branch || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  skip-deploy:
    name: Skip Deployment (no changes)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.needs_deploy == 'false'
    steps:
      - name: No deployment needed
        run: |
          echo "## ⏭️ Deployment Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No deployable changes detected. Only documentation or non-service files were modified." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
