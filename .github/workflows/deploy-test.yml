name: Deploy to Test Server

# Otomatik Deployment: test/staging branch'ine push yapıldığında
#   - Seed: Çalışmaz (mevcut data korunur)
#   - Build: Cache kullanılır (hızlı)
#   - Backup: Alınır (güvenli)
#
# Manuel Deployment: "Run workflow" butonu ile
#   - Tüm seçenekler sizin kontrolünüzde
#   - Detaylı kılavuz: .github/DEPLOYMENT_GUIDE.md

on:
  push:
    branches:
      - test
      - staging
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging
      run_seed:
        description: 'Run seed data? (Varsayılan: Hayır)'
        required: false
        default: false
        type: boolean
      force_rebuild:
        description: 'Force rebuild without cache? (Varsayılan: Hayır)'
        required: false
        default: false
        type: boolean
      skip_backup:
        description: 'Skip database backup? (Varsayılan: Hayır)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '23'

permissions:
  contents: write
  pull-requests: read

jobs:
  deploy:
    name: Deploy to Test Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Run linter
        run: pnpm --filter tipbox-backend run lint
        continue-on-error: true
        env:
          ESLINT_NO_DEV_ERRORS: true

      - name: Check SSH secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.HETZNER_SSH_KEY }}" ]; then
            echo "⚠️  HETZNER_SSH_KEY secret not configured. Skipping deployment."
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        if: steps.check-secrets.outputs.available == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known hosts
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Configure SSH
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          mkdir -p ~/.ssh/controlmasters
          cat >> ~/.ssh/config <<EOC
          Host hetzner-deploy
            HostName ${{ secrets.HETZNER_HOST }}
            User ${{ secrets.HETZNER_USER }}
            Port ${{ secrets.HETZNER_SSH_PORT || '22' }}
            IdentityAgent $SSH_AUTH_SOCK
            StrictHostKeyChecking accept-new
            ServerAliveInterval 60
            ServerAliveCountMax 10
            TCPKeepAlive yes
            ConnectTimeout 30
            ControlMaster auto
            ControlPath ~/.ssh/controlmasters/%r@%h:%p
            ControlPersist 10m
          EOC
          chmod 600 ~/.ssh/config

      - name: Test SSH Connection
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          echo "Testing SSH connection..."
          ssh -v hetzner-deploy "echo '✅ SSH connection successful!'"

      - name: Prepare deployment
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: prepare
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          deploy_branch: ${{ github.event.inputs.branch || github.ref_name }}
          env_file: backend/.env.test

      - name: Backup database
        # Otomatik deployment: Backup alınır (varsayılan)
        # Manuel deployment: skip_backup seçeneğine göre
        if: steps.check-secrets.outputs.available == 'true' && github.event.inputs.skip_backup != 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: backup
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          db_user: tipbox_user
          db_name: tipbox_dev

      - name: Stop services
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: stop
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      - name: Build images
        # Otomatik deployment: Cache kullanılır (hızlı)
        # Manuel deployment: force_rebuild seçeneğine göre
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: build
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          force_rebuild: ${{ github.event.inputs.force_rebuild == true && 'true' || 'false' }}

      - name: Generate Prisma Client
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: prisma
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      - name: Start infrastructure services
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: infrastructure
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      - name: Wait for database
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: wait-db
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          db_user: tipbox_user

      - name: Run migrations
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: migrate
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      - name: Run seeds
        # Otomatik deployment: Seed çalışmaz (varsayılan)
        # Manuel deployment: run_seed işaretliyse çalışır
        if: steps.check-secrets.outputs.available == 'true' && github.event.inputs.run_seed == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: seed
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          db_user: tipbox_user
          db_name: tipbox_dev

      - name: Start all services
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: start
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      - name: Health check
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: health
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      - name: Cleanup deployment
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: cleanup
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      - name: Deployment Summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Server**: ${{ secrets.HETZNER_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Type**: ${{ github.event_name == 'workflow_dispatch' && 'Manuel' || 'Otomatik (git push)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚙️ Options Used" >> $GITHUB_STEP_SUMMARY
          echo "- **Seed Data**: ${{ github.event.inputs.run_seed || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Force Rebuild**: ${{ github.event.inputs.force_rebuild || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Skip Backup**: ${{ github.event.inputs.skip_backup || 'false' }}" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

