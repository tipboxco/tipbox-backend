name: Deploy to Test Server

on:
  push:
    branches:
      - test
      - staging
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging

jobs:
  test-workflow:
    name: Test Workflow Activation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Test step
        run: |
          echo "✅ Deploy to Test Server workflow is now active!"
          echo "This is a test run to activate the workflow"
