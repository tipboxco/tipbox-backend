name: Deploy to Test Server

# Otomatik Deployment: test/staging branch'ine push yapıldığında
#   - Seed: Çalışmaz (mevcut data korunur)
#   - Build: Cache kullanılır (hızlı)
#   - Backup: Alınır (güvenli)
#
# Manuel Deployment: "Run workflow" butonu ile
#   - Tüm seçenekler sizin kontrolünüzde
#   - Detaylı kılavuz: .github/DEPLOYMENT_GUIDE.md

on:
  push:
    branches:
      - test
      - staging
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging
      run_seed:
        description: 'Run seed data? (Varsayılan: Hayır)'
        required: false
        default: false
        type: boolean
      force_rebuild:
        description: 'Force rebuild without cache? (Varsayılan: Hayır)'
        required: false
        default: false
        type: boolean
      skip_backup:
        description: 'Skip database backup? (Varsayılan: Hayır)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

jobs:
  deploy:
    name: Deploy to Test Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check SSH secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.HETZNER_SSH_KEY }}" ]; then
            echo "⚠️  HETZNER_SSH_KEY secret not configured. Skipping deployment."
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        if: steps.check-secrets.outputs.available == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Configure SSH
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          mkdir -p ~/.ssh ~/.ssh/controlmasters
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOC
          Host hetzner-deploy
            HostName ${{ secrets.HETZNER_HOST }}
            User ${{ secrets.HETZNER_USER }}
            Port ${{ secrets.HETZNER_SSH_PORT || '22' }}
            IdentityAgent $SSH_AUTH_SOCK
            StrictHostKeyChecking accept-new
            ServerAliveInterval 60
            ServerAliveCountMax 10
            TCPKeepAlive yes
            ConnectTimeout 30
            ControlMaster auto
            ControlPath ~/.ssh/controlmasters/%r@%h:%p
            ControlPersist 10m
          EOC
          chmod 600 ~/.ssh/config

      - name: Prepare & Build
        if: steps.check-secrets.outputs.available == 'true'
        env:
          DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild == true && 'true' || 'false' }}
          SKIP_BACKUP: ${{ github.event.inputs.skip_backup == 'true' && 'true' || 'false' }}
        run: |
          ssh hetzner-deploy "export DEPLOY_BRANCH='$DEPLOY_BRANCH' FORCE_REBUILD='$FORCE_REBUILD' SKIP_BACKUP='$SKIP_BACKUP' && bash -s" << 'DEPLOY_SCRIPT'
            set -e
            PROJECT_DIR="/opt/tipbox-backend"
            COMPOSE_FILE="docker-compose.test.yml"
            DB_USER="${DB_USER:-tipbox_user}"
            DB_NAME="${DB_NAME:-tipbox_test}"

            # ── 1. Prepare: git pull ──
            echo "📥 Pulling branch: $DEPLOY_BRANCH"
            cd "$PROJECT_DIR"
            git fetch origin
            git checkout "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            git clean -fd

            if [ ! -f "backend/.env.test" ]; then
              echo "❌ backend/.env.test not found!"
              exit 1
            fi

            # ── 2. Backup (servisler hala çalışırken) ──
            if [ "$SKIP_BACKUP" != "true" ]; then
              echo "💾 Database backup..."
              BACKUP_DIR="${PROJECT_DIR}/backups"
              mkdir -p "$BACKUP_DIR"
              docker compose -f "$COMPOSE_FILE" exec -T postgres pg_dump -U "$DB_USER" "$DB_NAME" \
                > "$BACKUP_DIR/backup-$(date +%Y%m%d-%H%M%S).sql" 2>/dev/null || \
                echo "⚠️  Backup skipped (db not accessible)"
            fi

            # ── 3. Build (servisler hala çalışırken - zero downtime) ──
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            if [ "$FORCE_REBUILD" = "true" ]; then
              echo "🔨 Building images (no-cache)..."
              docker compose -f "$COMPOSE_FILE" build --no-cache
            else
              echo "🔨 Building images (cached)..."
              docker compose -f "$COMPOSE_FILE" build
            fi
            echo "✅ Build completed"
          DEPLOY_SCRIPT

      - name: Deploy & Migrate
        if: steps.check-secrets.outputs.available == 'true'
        env:
          RUN_SEED: ${{ github.event.inputs.run_seed == 'true' && 'true' || 'false' }}
        run: |
          ssh hetzner-deploy "export RUN_SEED='$RUN_SEED' && bash -s" << 'DEPLOY_SCRIPT'
            set -e
            PROJECT_DIR="/opt/tipbox-backend"
            COMPOSE_FILE="docker-compose.test.yml"
            DB_USER="${DB_USER:-tipbox_user}"
            DB_NAME="${DB_NAME:-tipbox_test}"
            cd "$PROJECT_DIR"

            # ── 4. Infrastructure'ın çalıştığından emin ol ──
            echo "🚀 Ensuring infrastructure is up..."
            docker compose -f "$COMPOSE_FILE" up -d postgres redis minio

            # DB hazır olana kadar bekle
            echo "⏳ Waiting for database..."
            for i in $(seq 1 20); do
              if docker compose -f "$COMPOSE_FILE" exec -T postgres pg_isready -U "$DB_USER" > /dev/null 2>&1; then
                echo "✅ Database ready"
                break
              fi
              [ "$i" -eq 20 ] && { echo "❌ Database not ready"; exit 1; }
              sleep 2
            done

            # ── 5. Migrations ──
            echo "📊 Running migrations..."
            docker compose -f "$COMPOSE_FILE" run --rm backend npx prisma generate
            docker compose -f "$COMPOSE_FILE" run --rm backend npx prisma migrate deploy || {
              echo "❌ Migration failed!"
              exit 1
            }
            docker compose -f "$COMPOSE_FILE" run --rm backend npx prisma db push --accept-data-loss || \
              echo "⚠️  Schema push failed, continuing..."

            # ── 6. Seed (sadece manuel + istenirse) ──
            if [ "$RUN_SEED" = "true" ]; then
              HAS_DATA=$(docker compose -f "$COMPOSE_FILE" exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -t -c \
                "SELECT COUNT(*) FROM users WHERE email LIKE '%@tipbox.%' LIMIT 1;" 2>/dev/null | xargs || echo "0")
              if [ "$HAS_DATA" = "0" ] || [ -z "$HAS_DATA" ]; then
                echo "🌱 Running seeds..."
                docker compose -f "$COMPOSE_FILE" run --rm backend npx ts-node scripts/clear-and-seed.ts --all || \
                  docker compose -f "$COMPOSE_FILE" run --rm backend npx ts-node scripts/clear-and-seed.ts || \
                  echo "⚠️  Seed failed, continuing..."
              else
                echo "⏭️  Database already has seed data"
              fi
            fi

            # ── 7. Start/restart tüm servisleri (sadece değişenler recreate edilir) ──
            echo "🚀 Starting all services..."
            docker compose -f "$COMPOSE_FILE" up -d
            echo "✅ Services started"
          DEPLOY_SCRIPT

      - name: Health check
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          ssh hetzner-deploy bash -s << 'HEALTH_SCRIPT'
            set -e
            cd /opt/tipbox-backend
            COMPOSE_FILE="docker-compose.test.yml"

            echo "🏥 Health check..."
            sleep 15
            for i in $(seq 1 60); do
              if docker compose -f "$COMPOSE_FILE" exec -T backend \
                node -e "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" 2>/dev/null; then
                echo "✅ Backend is healthy!"
                break
              fi
              [ "$i" -eq 60 ] && {
                echo "⚠️ Health check failed after 60 attempts"
                docker compose -f "$COMPOSE_FILE" logs --tail=30 backend
                docker compose -f "$COMPOSE_FILE" ps
                exit 1
              }
              [ $((i % 10)) -eq 0 ] && echo "⏳ Waiting... ($i/60)"
              sleep 3
            done

            # Cleanup
            docker image prune -f > /dev/null 2>&1
            echo "📊 Container status:"
            docker compose -f "$COMPOSE_FILE" ps
          HEALTH_SCRIPT

      - name: Deployment Summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.event.inputs.branch || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ github.event_name == 'workflow_dispatch' && 'Manuel' || 'Otomatik' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Yukarıdaki step loglarını kontrol edin." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.event.inputs.branch || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
