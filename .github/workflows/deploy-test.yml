name: Deploy to Test Server

# Otomatik Deployment: test/staging branch'ine push yapıldığında
#   - Seed: Çalışmaz (mevcut data korunur)
#   - Build: Cache kullanılır (hızlı)
#   - Backup: Alınır (güvenli)
#
# Manuel Deployment: "Run workflow" butonu ile
#   - Tüm seçenekler sizin kontrolünüzde
#   - Detaylı kılavuz: .github/DEPLOYMENT_GUIDE.md

on:
  push:
    branches:
      - test
      - staging
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging
      run_seed:
        description: 'Run seed data? (Varsayılan: Hayır)'
        required: false
        default: false
        type: boolean
      force_rebuild:
        description: 'Force rebuild without cache? (Varsayılan: Hayır)'
        required: false
        default: false
        type: boolean
      skip_backup:
        description: 'Skip database backup? (Varsayılan: Hayır)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      admin: ${{ steps.changes.outputs.admin }}
      catalog: ${{ steps.changes.outputs.catalog }}
      changed_services: ${{ steps.changes.outputs.changed_services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          # workflow_dispatch ise tüm servisleri build et
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "📋 Manual dispatch - building all services"
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "admin=true" >> $GITHUB_OUTPUT
            echo "catalog=true" >> $GITHUB_OUTPUT
            echo "changed_services=" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          BACKEND=false
          ADMIN=false
          CATALOG=false
          SERVICES=""

          if echo "$CHANGED" | grep -q "^backend/"; then
            BACKEND=true
            SERVICES="$SERVICES backend"
          fi
          if echo "$CHANGED" | grep -q "^admin-panel/"; then
            ADMIN=true
            SERVICES="$SERVICES admin-panel"
          fi
          if echo "$CHANGED" | grep -q "^catalog-service/"; then
            CATALOG=true
            SERVICES="$SERVICES catalog-service"
          fi

          # docker-compose veya workflow dosyaları değiştiyse tümünü build et
          if echo "$CHANGED" | grep -qE "^docker-compose|^\.github/"; then
            echo "⚠️  Shared config changed - building all services"
            SERVICES=""
          fi

          echo "backend=$BACKEND" >> $GITHUB_OUTPUT
          echo "admin=$ADMIN" >> $GITHUB_OUTPUT
          echo "catalog=$CATALOG" >> $GITHUB_OUTPUT
          echo "changed_services=$(echo $SERVICES | xargs)" >> $GITHUB_OUTPUT
          echo "Services to build: $(echo $SERVICES | xargs || echo 'all')"

  deploy:
    name: Deploy to Test Server
    runs-on: ubuntu-latest
    needs: detect-changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check SSH secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.HETZNER_SSH_KEY }}" ]; then
            echo "⚠️  HETZNER_SSH_KEY secret not configured. Skipping deployment."
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        if: steps.check-secrets.outputs.available == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Configure SSH
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          mkdir -p ~/.ssh ~/.ssh/controlmasters
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOC
          Host hetzner-deploy
            HostName ${{ secrets.HETZNER_HOST }}
            User ${{ secrets.HETZNER_USER }}
            Port ${{ secrets.HETZNER_SSH_PORT || '22' }}
            IdentityAgent $SSH_AUTH_SOCK
            StrictHostKeyChecking accept-new
            ServerAliveInterval 60
            ServerAliveCountMax 10
            TCPKeepAlive yes
            ConnectTimeout 30
            ControlMaster auto
            ControlPath ~/.ssh/controlmasters/%r@%h:%p
            ControlPersist 10m
          EOC
          chmod 600 ~/.ssh/config

      # ── 1. Prepare: git pull ──
      - name: Prepare deployment
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: prepare
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          deploy_branch: ${{ github.event.inputs.branch || github.ref_name }}
          env_file: .env.test

      # ── 2. Backup (skip_backup=true ise atlanır) ──
      - name: Backup database
        if: steps.check-secrets.outputs.available == 'true' && github.event.inputs.skip_backup != 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: backup
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          db_user: tipbox_user
          db_name: tipbox_test

      # ── 3. Build (sadece değişen servisler) ──
      - name: Build images
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: build
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          force_rebuild: ${{ github.event.inputs.force_rebuild == 'true' && 'true' || 'false' }}
          changed_services: ${{ needs.detect-changes.outputs.changed_services }}

      # ── 4. Infrastructure (postgres, redis, minio) ──
      - name: Start infrastructure services
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: infrastructure
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      # ── 5. Wait for DB ──
      - name: Wait for database
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: wait-db
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          db_user: tipbox_user
          db_name: tipbox_test

      # ── 6. Migrations ──
      - name: Run migrations
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: migrate
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      # ── 7. Seed (sadece manuel + istenirse) ──
      - name: Run seeds
        if: steps.check-secrets.outputs.available == 'true' && github.event.inputs.run_seed == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: seed
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml
          db_user: tipbox_user
          db_name: tipbox_test

      # ── 8. Start all services ──
      - name: Start all services
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: start
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      # ── 9. Health check ──
      - name: Health check
        if: steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: health
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      # ── 10. Cleanup ──
      - name: Cleanup deployment
        if: always() && steps.check-secrets.outputs.available == 'true'
        uses: ./.github/actions/execute-remote-stage
        with:
          ssh_host: hetzner-deploy
          stage: cleanup
          project_dir: /opt/tipbox-backend
          compose_file: docker-compose.test.yml

      - name: Deployment Summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.event.inputs.branch || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ github.event_name == 'workflow_dispatch' && 'Manuel' || 'Otomatik' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Yukarıdaki step loglarını kontrol edin." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.event.inputs.branch || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
