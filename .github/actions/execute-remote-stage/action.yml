name: 'Execute Remote Deployment Stage'
description: 'Execute a deployment stage on remote server via SSH'
inputs:
  ssh_host:
    description: 'SSH host alias'
    required: true
  stage:
    description: 'Stage name to execute'
    required: true
  project_dir:
    description: 'Project directory path'
    required: true
  compose_file:
    description: 'Docker compose file name'
    required: true
  deploy_branch:
    description: 'Branch to deploy'
    required: false
  env_file:
    description: 'Environment file name'
    required: false
  db_user:
    description: 'Database user'
    required: false
  db_name:
    description: 'Database name'
    required: false
  force_rebuild:
    description: 'Force rebuild without cache'
    required: false
    default: 'false'
  changed_services:
    description: 'Space-separated list of services to build (empty = all)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Execute stage
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        STAGE: ${{ inputs.stage }}
        PROJECT_DIR: ${{ inputs.project_dir }}
        COMPOSE_FILE: ${{ inputs.compose_file }}
        DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
        ENV_FILE: ${{ inputs.env_file }}
        DB_USER: ${{ inputs.db_user }}
        DB_NAME: ${{ inputs.db_name }}
        FORCE_REBUILD: ${{ inputs.force_rebuild }}
        CHANGED_SERVICES: ${{ inputs.changed_services }}
      run: |
        # prepare stage özeldir: git pull yapmadan önce sunucuda script dosyaları yok.
        # Bu yüzden prepare inline heredoc ile çalışır; diğer tüm stage'ler script çağırır.
        if [ "$STAGE" = "prepare" ]; then
          ssh "$SSH_HOST" "export PROJECT_DIR='$PROJECT_DIR' DEPLOY_BRANCH='$DEPLOY_BRANCH' ENV_FILE='$ENV_FILE' && bash -s" << 'PREPARE_INLINE'
            set -e
            echo "🚀 Starting deployment..."
            echo "📌 Deploying branch: $DEPLOY_BRANCH"
            cd "$PROJECT_DIR" || { echo "❌ Project directory not found: $PROJECT_DIR"; exit 1; }
            echo "📥 Pulling latest changes from branch: $DEPLOY_BRANCH"
            git fetch origin
            git checkout "$DEPLOY_BRANCH"
            echo "🧹 Cleaning local changes..."
            git reset --hard "origin/$DEPLOY_BRANCH"
            git clean -fd -e ".env*" -e "backups/"
            if [ ! -f "$ENV_FILE" ]; then
              echo "❌ $ENV_FILE file not found! Please create it first."
              echo "📋 Available env files:"
              ls -la "$PROJECT_DIR"/.env* 2>/dev/null || echo "  No .env files found"
              exit 1
            fi
            echo "✅ Preparation completed"
        PREPARE_INLINE
        else
          SCRIPT_PATH="$PROJECT_DIR/.github/scripts/initialize/stage-${STAGE}.sh"
          ssh "$SSH_HOST" \
            "export STAGE='$STAGE' PROJECT_DIR='$PROJECT_DIR' COMPOSE_FILE='$COMPOSE_FILE' DEPLOY_BRANCH='$DEPLOY_BRANCH' ENV_FILE='$ENV_FILE' DB_USER='$DB_USER' DB_NAME='$DB_NAME' FORCE_REBUILD='$FORCE_REBUILD' CHANGED_SERVICES='$CHANGED_SERVICES' && bash '$SCRIPT_PATH'"
        fi
