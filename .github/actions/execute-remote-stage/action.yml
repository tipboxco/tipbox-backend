name: 'Execute Remote Deployment Stage'
description: 'Execute a deployment stage on remote server via SSH'
inputs:
  ssh_host:
    description: 'SSH host alias'
    required: true
  stage:
    description: 'Stage name to execute'
    required: true
  project_dir:
    description: 'Project directory path'
    required: true
  compose_file:
    description: 'Docker compose file name'
    required: true
  deploy_branch:
    description: 'Branch to deploy'
    required: false
  env_file:
    description: 'Environment file name'
    required: false
  db_user:
    description: 'Database user'
    required: false
  db_name:
    description: 'Database name'
    required: false
  force_rebuild:
    description: 'Force rebuild without cache'
    required: false
    default: 'false'
  changed_services:
    description: 'Space-separated list of services to build (empty = all)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Execute stage
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        STAGE: ${{ inputs.stage }}
        PROJECT_DIR: ${{ inputs.project_dir }}
        COMPOSE_FILE: ${{ inputs.compose_file }}
        DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
        ENV_FILE: ${{ inputs.env_file }}
        DB_USER: ${{ inputs.db_user }}
        DB_NAME: ${{ inputs.db_name }}
        FORCE_REBUILD: ${{ inputs.force_rebuild }}
        CHANGED_SERVICES: ${{ inputs.changed_services }}
      run: |
        ssh "$SSH_HOST" "export STAGE='$STAGE' PROJECT_DIR='$PROJECT_DIR' COMPOSE_FILE='$COMPOSE_FILE' DEPLOY_BRANCH='$DEPLOY_BRANCH' ENV_FILE='$ENV_FILE' DB_USER='$DB_USER' DB_NAME='$DB_NAME' FORCE_REBUILD='$FORCE_REBUILD' CHANGED_SERVICES='$CHANGED_SERVICES' && bash -s" << 'STAGE_SCRIPT'
          set -e
          
          case "$STAGE" in
            prepare)
              echo "🚀 Starting test environment deployment..."
              echo "📌 Deploying branch: $DEPLOY_BRANCH"
              cd "$PROJECT_DIR" || { echo "❌ Project directory not found: $PROJECT_DIR"; exit 1; }
              echo "📥 Pulling latest changes from branch: $DEPLOY_BRANCH"
              git fetch origin
              git checkout "$DEPLOY_BRANCH"
              echo "🧹 Cleaning local changes..."
              git reset --hard "origin/$DEPLOY_BRANCH"
              git clean -fd -e ".env*" -e "backups/"
              if [ ! -f "$ENV_FILE" ]; then
                echo "❌ $ENV_FILE file not found! Please create it first."
                echo "📋 Available env files:"
                ls -la "$PROJECT_DIR"/.env* 2>/dev/null || echo "  No .env files found"
                exit 1
              fi
              echo "✅ Preparation completed"
              ;;
            backup)
              echo "💾 Creating database backup..."
              cd "$PROJECT_DIR" || exit 1
              BACKUP_DIR="${PROJECT_DIR}/backups"
              mkdir -p "$BACKUP_DIR"
              BACKUP_FILE="${BACKUP_DIR}/backup-$(date +%Y%m%d-%H%M%S).sql"
              docker compose -f "$COMPOSE_FILE" exec -T postgres pg_dump -U "$DB_USER" "$DB_NAME" > "$BACKUP_FILE" 2>/dev/null || {
                echo "⚠️  Backup failed or database not accessible, continuing..."
              }
              echo "✅ Backup completed (if accessible)"
              ;;
            stop)
              echo "🛑 Stopping and removing all containers..."
              cd "$PROJECT_DIR" || exit 1
              docker compose -f "$COMPOSE_FILE" down || {
                echo "⚠️  Some containers were not running, continuing..."
              }
              echo "✅ Services stopped"
              ;;
            build)
              echo "🔨 Building Docker images..."
              cd "$PROJECT_DIR" || exit 1
              # Disk %85'in üzerindeyse build öncesi temizlik yap
              DISK_USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
              echo "💾 Current disk usage: ${DISK_USAGE}%"
              if [ "$DISK_USAGE" -gt 85 ]; then
                echo "⚠️  Disk usage above 85%, cleaning up before build..."
                docker image prune -af
                docker builder prune -f
                docker container prune -f
                echo "💾 Disk usage after cleanup: $(df / | tail -1 | awk '{print $5}')"
              fi
              export DOCKER_BUILDKIT=1
              export COMPOSE_DOCKER_CLI_BUILD=1
              # Trim whitespace from CHANGED_SERVICES
              SERVICES=$(echo "$CHANGED_SERVICES" | xargs)
              if [ "$FORCE_REBUILD" = "true" ]; then
                echo "🔄 Force rebuild requested - building without cache"
                docker compose -f "$COMPOSE_FILE" build --no-cache $SERVICES
              elif [ -z "$SERVICES" ]; then
                echo "⚡ Building all services with cache (BuildKit)..."
                docker compose -f "$COMPOSE_FILE" build
              else
                echo "⚡ Building only changed services with cache (BuildKit): $SERVICES"
                docker compose -f "$COMPOSE_FILE" build $SERVICES
              fi
              echo "✅ Images built successfully"
              ;;
            prisma)
              echo "🔧 Generating Prisma Client..."
              cd "$PROJECT_DIR" || exit 1
              # Host'ta backend dizininde prisma generate çalıştır
              cd backend && npx prisma generate && cd .. || {
                echo "⚠️  Prisma generate on host failed, trying in container..."
                cd "$PROJECT_DIR"
                docker compose -f "$COMPOSE_FILE" run --rm backend npx prisma generate || {
                  echo "❌ Prisma generate failed! Check the logs above."
                  exit 1
                }
              }
              echo "✅ Prisma Client generated"
              ;;
            infrastructure)
              echo "🚀 Starting infrastructure services..."
              cd "$PROJECT_DIR" || exit 1
              docker compose -f "$COMPOSE_FILE" up -d postgres redis minio
              echo "✅ Infrastructure services started"
              ;;
            wait-db)
              echo "⏳ Waiting for infrastructure services to be ready..."
              cd "$PROJECT_DIR" || exit 1

              # 1. Postgres process hazır mı (pg_isready)
              echo "🐘 Waiting for PostgreSQL process..."
              for i in $(seq 1 30); do
                if docker compose -f "$COMPOSE_FILE" exec -T postgres pg_isready -U "$DB_USER" > /dev/null 2>&1; then
                  echo "✅ PostgreSQL process is ready!"
                  break
                fi
                if [ "$i" -eq 30 ]; then
                  echo "❌ PostgreSQL not ready after 30 attempts"
                  docker compose -f "$COMPOSE_FILE" logs postgres
                  exit 1
                fi
                echo "⏳ Waiting for PostgreSQL process... ($i/30)"
                sleep 3
              done

              # 2. Hedef DB'ye gerçek bağlantı testi (migration için gerekli)
              echo "🐘 Waiting for target database to accept connections..."
              for i in $(seq 1 20); do
                if docker compose -f "$COMPOSE_FILE" exec -T postgres \
                  psql -U "$DB_USER" -d "$DB_NAME" -c "SELECT 1" > /dev/null 2>&1; then
                  echo "✅ Database '$DB_NAME' is accepting connections!"
                  break
                fi
                if [ "$i" -eq 20 ]; then
                  echo "❌ Database '$DB_NAME' not accepting connections after 20 attempts"
                  docker compose -f "$COMPOSE_FILE" logs postgres
                  exit 1
                fi
                echo "⏳ Waiting for database connection... ($i/20)"
                sleep 3
              done

              # 3. Redis bekle
              echo "🔴 Waiting for Redis..."
              for i in $(seq 1 20); do
                if docker compose -f "$COMPOSE_FILE" exec -T redis redis-cli ping 2>/dev/null | grep -q "PONG"; then
                  echo "✅ Redis is ready!"
                  break
                fi
                if [ "$i" -eq 20 ]; then
                  echo "❌ Redis not ready after 20 attempts"
                  docker compose -f "$COMPOSE_FILE" logs redis
                  exit 1
                fi
                echo "⏳ Waiting for Redis... ($i/20)"
                sleep 2
              done

              echo "✅ All infrastructure services are ready"
              ;;
            migrate)
              echo "📊 Running database migrations..."
              cd "$PROJECT_DIR" || exit 1
              
              # 1. Prisma Client'ı yeniden generate et
              echo "🔧 Generating Prisma Client..."
              docker compose -f "$COMPOSE_FILE" run --rm backend npx prisma generate || {
                echo "❌ Prisma generate failed!"
                exit 1
              }
              
              # 2. Migration'ları uygula
              echo "📊 Deploying migrations..."
              MIGRATE_OUTPUT=$(docker compose -f "$COMPOSE_FILE" run --rm backend npx prisma migrate deploy 2>&1) || {
                echo "$MIGRATE_OUTPUT"
                # P3005: DB dolu ama migration history yok → baseline uygula
                if echo "$MIGRATE_OUTPUT" | grep -q "P3005"; then
                  echo "⚠️  Database not empty without migration history. Applying baseline..."
                  MIGRATION_NAME=$(docker compose -f "$COMPOSE_FILE" run --rm backend \
                    sh -c "ls prisma/migrations | grep -v migration_lock | head -1" 2>/dev/null | tr -d '\r' | xargs)
                  if [ -n "$MIGRATION_NAME" ]; then
                    docker compose -f "$COMPOSE_FILE" run --rm backend \
                      npx prisma migrate resolve --applied "$MIGRATION_NAME" || {
                        echo "❌ Baseline failed!"
                        exit 1
                      }
                    echo "✅ Baseline applied: $MIGRATION_NAME"
                    # Baseline sonrası tekrar deploy
                    docker compose -f "$COMPOSE_FILE" run --rm backend npx prisma migrate deploy || {
                      echo "❌ Migration failed after baseline!"
                      exit 1
                    }
                  else
                    echo "❌ No migration found to baseline"
                    exit 1
                  fi
                else
                  echo "$MIGRATE_OUTPUT"
                  echo "❌ Migration failed! Check the logs above."
                  exit 1
                fi
              }
              echo "$MIGRATE_OUTPUT"
              
              echo "✅ Migrations completed"
              ;;
            seed)
              echo "🌱 Checking if database needs seeding..."
              cd "$PROJECT_DIR" || exit 1
              
              # Check if users table has data (smart seed check)
              HAS_DATA=$(docker compose -f "$COMPOSE_FILE" exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -t -c "SELECT COUNT(*) FROM users WHERE email LIKE '%@tipbox.%' LIMIT 1;" 2>/dev/null | xargs || echo "0")
              
              if [ "$HAS_DATA" = "0" ] || [ -z "$HAS_DATA" ]; then
                echo "🌱 Running database seeds..."
                
                # Önce Prisma Client'ın güncel olduğundan emin ol
                docker compose -f "$COMPOSE_FILE" run --rm backend npx prisma generate
                
                # Seed'i çalıştır
                docker compose -f "$COMPOSE_FILE" run --rm backend npx ts-node scripts/clear-and-seed.ts --all || {
                  echo "⚠️  Full seed failed, trying minimal seed..."
                  docker compose -f "$COMPOSE_FILE" run --rm backend npx ts-node scripts/clear-and-seed.ts || {
                    echo "⚠️  Seed failed, continuing without seed data..."
                  }
                }
                echo "✅ Seeds completed"
              else
                echo "⏭️  Database already has seed data, skipping..."
                echo "✅ Seed check completed"
              fi
              ;;
            start)
              echo "🚀 Starting all services..."
              cd "$PROJECT_DIR" || exit 1
              docker compose -f "$COMPOSE_FILE" up -d
              echo "✅ All services started"
              ;;
            health)
              echo "🏥 Checking backend health..."
              cd "$PROJECT_DIR" || exit 1

              # 1. Önce backend container'ının ayağa kalkmasını bekle (running durumu)
              echo "⏳ Waiting for backend container to start..."
              for i in $(seq 1 20); do
                CONTAINER_STATUS=$(docker compose -f "$COMPOSE_FILE" ps backend --format json 2>/dev/null | grep -o '"Status":"[^"]*"' | head -1 || echo "")
                RUNNING=$(docker compose -f "$COMPOSE_FILE" ps backend 2>/dev/null | grep -E "Up|running" | head -1 || echo "")
                if [ -n "$RUNNING" ]; then
                  echo "✅ Backend container is running"
                  break
                fi
                if [ "$i" -eq 20 ]; then
                  echo "❌ Backend container did not start"
                  docker compose -f "$COMPOSE_FILE" logs --tail=50 backend
                  exit 1
                fi
                echo "⏳ Waiting for container... ($i/20)"
                sleep 3
              done

              # 2. Docker healthcheck durumunu bekle (Dockerfile'daki HEALTHCHECK)
              echo "⏳ Waiting for Docker healthcheck to pass..."
              for i in $(seq 1 30); do
                HEALTH=$(docker inspect --format='{{.State.Health.Status}}' \
                  "$(docker compose -f "$COMPOSE_FILE" ps -q backend 2>/dev/null)" 2>/dev/null || echo "none")
                if [ "$HEALTH" = "healthy" ]; then
                  echo "✅ Docker healthcheck passed!"
                  break
                elif [ "$HEALTH" = "unhealthy" ]; then
                  echo "❌ Docker healthcheck reported unhealthy"
                  docker compose -f "$COMPOSE_FILE" logs --tail=30 backend
                  exit 1
                elif [ "$HEALTH" = "none" ] || [ -z "$HEALTH" ]; then
                  # HEALTHCHECK tanımlı değilse direkt HTTP kontrol yap
                  echo "ℹ️  No Docker healthcheck defined, falling back to HTTP check"
                  break
                fi
                echo "⏳ Healthcheck status: $HEALTH ($i/30)"
                sleep 5
              done

              # 3. HTTP /health endpoint kontrolü
              echo "🌐 Checking HTTP health endpoint..."
              MAX_RETRIES=40
              RETRY_COUNT=0
              while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                if docker compose -f "$COMPOSE_FILE" exec -T backend \
                  node -e "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" 2>/dev/null; then
                  echo "✅ Backend HTTP health check passed!"
                  break
                fi

                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                  echo "⚠️ HTTP health check failed after $MAX_RETRIES attempts"
                  echo "📋 Backend logs (last 40 lines):"
                  docker compose -f "$COMPOSE_FILE" logs --tail=40 backend
                  echo ""
                  echo "📊 Container status:"
                  docker compose -f "$COMPOSE_FILE" ps
                  exit 1
                fi
                if [ $((RETRY_COUNT % 10)) -eq 0 ]; then
                  echo "⏳ Waiting for HTTP health... ($RETRY_COUNT/$MAX_RETRIES)"
                fi
                sleep 3
              done
              ;;
            cleanup)
              echo "🧹 Cleaning up old Docker resources..."
              cd "$PROJECT_DIR" || exit 1
              # Dangling image'ları sil
              docker image prune -f
              # Build cache'i temizle (en çok yer kaplayan)
              docker builder prune -f --keep-storage=2gb 2>/dev/null || docker builder prune -f
              # Kullanılmayan container'ları sil
              docker container prune -f
              echo "💾 Disk usage after cleanup:"
              df -h / | tail -1
              echo "🐳 Docker disk usage:"
              docker system df
              echo "📊 Container status:"
              docker compose -f "$COMPOSE_FILE" ps
              echo "✅ Test environment deployment completed successfully!"
              ;;
            *)
              echo "❌ Unknown stage: $STAGE"
              exit 1
              ;;
          esac
        STAGE_SCRIPT

