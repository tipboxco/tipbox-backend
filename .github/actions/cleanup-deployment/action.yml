name: 'Cleanup Deployment'
description: 'Clean up old Docker images and show container status'
inputs:
  compose_file:
    description: 'Docker compose file name'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Cleanup and show status
      shell: bash
      run: |
        set -e
        
        COMPOSE_FILE="${{ inputs.compose_file }}"
        
        # Eski image'ları temizle
        echo "🧹 Cleaning up old Docker images..."
        docker image prune -f
        
        # Container durumunu göster
        echo "📊 Container status:"
        docker compose -f "$COMPOSE_FILE" ps
        
        echo "✅ Test environment deployment completed successfully!"

