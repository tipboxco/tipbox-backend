name: 'Build Images'
description: 'Build Docker images'
inputs:
  compose_file:
    description: 'Docker compose file name'
    required: true
  service:
    description: 'Service name to build (default: backend)'
    required: false
    default: 'backend'
  no_cache:
    description: 'Build without cache'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Build Docker images
      shell: bash
      run: |
        set -e
        
        COMPOSE_FILE="${{ inputs.compose_file }}"
        NO_CACHE_FLAG=""
        if [ "${{ inputs.no_cache }}" == "true" ]; then
          NO_CACHE_FLAG="--no-cache"
        fi
        
        # Docker Compose ile build
        echo "🔨 Building Docker images..."
        docker compose -f "$COMPOSE_FILE" build $NO_CACHE_FLAG "${{ inputs.service }}"
        
        echo "✅ Images built successfully"

