name: 'Run Database Migrations'
description: 'Run Prisma database migrations'
inputs:
  compose_file:
    description: 'Docker compose file name'
    required: true
  service:
    description: 'Service name to run migrations in'
    required: false
    default: 'backend'
runs:
  using: 'composite'
  steps:
    - name: Check for failed migrations
      shell: bash
      run: |
        set +e
        
        COMPOSE_FILE="${{ inputs.compose_file }}"
        SERVICE="${{ inputs.service }}"
        
        # Database credentials - compose file'a göre belirle
        if [[ "$COMPOSE_FILE" == *"test"* ]]; then
          DB_USER="tipbox_user"
          DB_NAME="tipbox_test"
        elif [[ "$COMPOSE_FILE" == *"prod"* ]]; then
          DB_USER="tipbox_user"
          DB_NAME="tipbox_prod"
        else
          DB_USER="tipbox_user"
          DB_NAME="tipbox_dev"
        fi
        
        echo "🔍 Checking for failed migrations..."
        echo "📊 Database: $DB_NAME"
        
        # Database'den doğrudan başarısız migration'ları kontrol et
        FAILED_MIGRATIONS=$(docker compose -f "$COMPOSE_FILE" exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -t -c "SELECT migration_name FROM _prisma_migrations WHERE finished_at IS NULL;" 2>&1 | grep -v "^$" | xargs)
        
        if [ -n "$FAILED_MIGRATIONS" ]; then
          echo "⚠️  Başarısız migration bulundu: $FAILED_MIGRATIONS"
          
          for FAILED_MIGRATION in $FAILED_MIGRATIONS; do
            echo ""
            echo "🔧 Temizleniyor: $FAILED_MIGRATION"
            
            # Migration detaylarını göster
            docker compose -f "$COMPOSE_FILE" exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" << EOF
SELECT 
  migration_name,
  started_at,
  finished_at,
  logs,
  CASE 
    WHEN finished_at IS NULL THEN '❌ Başarısız (tamamlanmadı)'
    WHEN rolled_back_at IS NOT NULL THEN '🔄 Geri alındı'
    ELSE '✅ Başarılı'
  END as durum
FROM _prisma_migrations 
WHERE migration_name = '$FAILED_MIGRATION';
EOF
            
            # Başarısız kaydı temizle
            docker compose -f "$COMPOSE_FILE" exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" << EOF
DELETE FROM _prisma_migrations 
WHERE migration_name = '$FAILED_MIGRATION' 
  AND finished_at IS NULL;
  
SELECT 'Migration kaydı temizlendi: $FAILED_MIGRATION' as sonuc;
EOF
            
            echo "✅ $FAILED_MIGRATION temizlendi"
          done
          
          echo ""
          echo "✅ Tüm başarısız migration kayıtları temizlendi"
          echo "🔄 Migration tekrar çalışacak..."
        else
          echo "✅ Başarısız migration bulunamadı"
        fi
        
        set -e
    
    - name: Run migrations
      shell: bash
      run: |
        set -e
        
        COMPOSE_FILE="${{ inputs.compose_file }}"
        SERVICE="${{ inputs.service }}"
        
        # Database credentials - compose file'a göre belirle
        if [[ "$COMPOSE_FILE" == *"test"* ]]; then
          DB_USER="tipbox_user"
          DB_NAME="tipbox_test"
        elif [[ "$COMPOSE_FILE" == *"prod"* ]]; then
          DB_USER="tipbox_user"
          DB_NAME="tipbox_prod"
        else
          DB_USER="tipbox_user"
          DB_NAME="tipbox_dev"
        fi
        
        # Prisma Client generate et (migration'dan önce)
        echo "🔧 Generating Prisma Client..."
        docker compose -f "$COMPOSE_FILE" run --rm "$SERVICE" npx prisma generate
        
        # Migration'ları çalıştır
        echo "📊 Deploying migrations..."
        
        if ! docker compose -f "$COMPOSE_FILE" run --rm "$SERVICE" npx prisma migrate deploy; then
          echo ""
          echo "❌ Migration BAŞARISIZ!"
          echo ""
          echo "🔍 Başarısız migration detayları:"
          docker compose -f "$COMPOSE_FILE" exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" << EOF || true
SELECT 
  migration_name,
  started_at,
  finished_at,
  rolled_back_at,
  logs,
  CASE 
    WHEN finished_at IS NULL THEN '❌ Başarısız (tamamlanmadı)'
    WHEN rolled_back_at IS NOT NULL THEN '🔄 Geri alındı'
    ELSE '✅ Başarılı'
  END as durum
FROM _prisma_migrations 
ORDER BY started_at DESC 
LIMIT 5;
EOF
          echo ""
          echo "💡 İpucu: Migration dosyasını kontrol edin: prisma/migrations/[migration_name]/migration.sql"
          echo "💡 Manuel düzeltme için: ./scripts/fix-failed-migration.sh [migration_name] $DB_NAME $COMPOSE_FILE"
          exit 1
        fi
        
        echo "✅ Migrations completed successfully"

