# Prisma Studio — dedicated HTTPS origin on :8443 (root path so window.location.origin/api works)
# Geçici çözüm: Tailscale VPN'i devre dışıyken Prisma Studio'ya domain üzerinden erişim.
# htpasswd dosyası repo DIŞINDA (/opt/tipbox-studio/.studio.htpasswd) tutulur — secret git'e girmez.
# Kaldırmak için: docker-compose.test.yml'den 8443 portu + bu mount'ları sil.
server {
    listen 8443 ssl;
    http2 on;
    server_name api-test.tipbox.co;

    ssl_certificate /etc/letsencrypt/live/api-test.tipbox.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-test.tipbox.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Prisma Studio has no auth of its own -> protect the whole origin
    auth_basic "Prisma Studio";
    auth_basic_user_file /etc/nginx/.studio.htpasswd;

    location / {
        set $studio http://prisma-studio:5555;
        proxy_pass $studio;
        proxy_http_version 1.1;
        # databrowser uses plain HTTP transport (no websocket) -> avoid the
        # "Connection: upgrade" gotcha that makes Node upstreams drop POST /api
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
